[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]


[project]
name = "mqt-sqr"
version = "0.1.0"
description = "MQT SQR - An MQT tool for spin qubit routing"
readme = "README.md"
keywords = [ "MQT", "quantum computing" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
dependencies = [
  "kiwisolver>=1.5",
  "matplotlib>=3.7.1",
  "matplotlib>=3.8; python_version>='3.12'",
  "matplotlib>=3.10.5; python_version>='3.14'",
  "matplotlib>=3.10; python_version>='3.13'",
  "networkx>=2.8.8",
  "numpy>=1.24",
  "numpy>=1.26; python_version>='3.12'",
  "numpy>=2.1; python_version>='3.13'",
  "numpy>=2.3.2; python_version>='3.14'",
  "typing-extensions>=4.16",
]

[[project.authors]]
name = "Julian Shen"
email = "julian.shen@tum.de"

[project.urls]
Homepage = "https://github.com/munich-quantum-toolkit/sqr"
Documentation = "https://mqt.readthedocs.io/projects/sqr"
Issues = "https://github.com/munich-quantum-toolkit/sqr/issues"
Discussions = "https://github.com/munich-quantum-toolkit/sqr/discussions"


[dependency-groups]
dev = [
  { include-group = "test" },
  "nox>=2025.11.12",
  "prek>=0.2.27",
]
test = [
  "pytest>=9.0.1",
  "pytest-console-scripts>=1.4.1",
  "pytest-cov>=7.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
]
docs = [
  "furo>=2025.12.19",
  "myst-nb>=1.4",
  "sphinx>=9",
  "sphinx-autoapi>=3.6",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-llm>=1",
  "sphinxcontrib-bibtex>=2.7",
  "sphinxext-opengraph>=0.13",
]


[tool.uv]
required-version = ">=0.8.17"

[tool.uv.sources]
mqt-sqr = { workspace = true }

[tool.uv.build-backend]
module-name = "mqt.sqr"


[tool.ruff]
line-length = 120
namespace-packages = [ "mqt" ]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"docs/**" = [ "INP001", "T20" ]
"eval/**" = [ "INP001" ]
"examples/**" = [ "INP001" ]
"tests/**" = [ "INP001" ]

[tool.ruff.lint.isort]
known-first-party = [ "mqt.sqr" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "C90",     # <...> too complex
  "COM812",  # Conflicts with formatter
  "D",       # We do not have docstrings yet
  "PLR09",   # Too many <...>
  "PLR1702", # Too many nested blocks
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
  "S404",    # `subprocess` module is possibly insecure
]
future-annotations = true


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files anymore"


[tool.check-sdist]
# uv_build 0.12 emits a TOML 1.0-normalized pyproject.toml and preserves the
# original file in source distributions, even when the source already is
# TOML 1.0.
sdist-only = [ "pyproject.toml.orig" ]
git-only = [
  ".gitignore",
  ".license-tools-config.json",
  ".readthedocs.yaml",
  ".rumdl.toml",
  "AGENTS.md",
  "docs/**",
  "eval/**",
  "examples/**",
  "sitecustomize.py",
  "tests/**",
  "uv.lock",
]


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  '"id": ".*",',
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # ignore line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on" # ignore block
]

[tool.typos.default.extend-words]
wille = "wille"
strat = "strat"


[tool.ty.src]
exclude = [
  "docs/**",
]

[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true


[tool.pytest]
addopts = [
  "-ra",
  "--showlocals",
  "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
filterwarnings = [
  "error",
]
log_level = "INFO"
minversion = "9.0"
strict = true
testpaths = [ "tests" ]


[tool.coverage]
precision = 1
show_missing = true
skip_empty = true

[tool.coverage.run]
source = [ "mqt.sqr" ]
parallel = true
disable_warnings = [
  "no-sysmon",
]
core = "sysmon"

[tool.coverage.report]
exclude_also = [
  '\.\.\.',
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]
